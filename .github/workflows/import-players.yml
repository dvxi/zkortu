name: Import player profiles

# Weekly: adds a Sanity profile for every new top-100 ATP/WTA player and every
# newly ranked Polish player. Existing profiles are never modified.
on:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC, after the rankings update
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import new players into Sanity
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'g3425kho' }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
        run: npx tsx scripts/import-players.ts
